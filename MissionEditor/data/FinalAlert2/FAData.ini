; Script action format:
; # or start-end=Description, parameter type, detailed description
[ScriptActions]
10000=Phobos: Attack target type (repeat),59,Attacks the selected generic target type until the team is destroyed.
10001=Phobos: Attack target type (once),59,Attacks the selected generic target type until a team member destroys the target.
10002=Phobos: Attack AI target type (repeat),60,Attacks a target from the selected AITargetTypes entry.
10003=Phobos: Attack AI target type (once),60,Attacks a target from the selected AITargetTypes entry until it is destroyed.
10004=Phobos: Attack random AI target type,60,Attacks a random target from the selected AITargetTypes entry.
10005=Phobos: Attack farthest target type (repeat),59,Attacks the farthest target from the selected generic target type.
10006=Phobos: Attack farthest target type (once),59,Attacks the farthest target from the selected generic target type until it is destroyed.
10007=Phobos: Attack farthest AI target type (repeat),60,Attacks the farthest target from the selected AITargetTypes entry.
10008=Phobos: Attack farthest AI target type (once),60,Attacks the farthest target from the selected AITargetTypes entry until it is destroyed.
10009=Phobos: Attack random farthest AI target type,60,Attacks a random farthest target from the selected AITargetTypes entry.
10010=Phobos: Attack high-threat target type (repeat),59,Attacks the nearest high-threat target from the selected generic target type.
10011=Phobos: Attack high-threat target type (once),59,Attacks the nearest high-threat target from the selected generic target type until it is destroyed.
10012=Phobos: Attack high-threat AI target type (repeat),60,Attacks the nearest high-threat target from the selected AITargetTypes entry.
10013=Phobos: Attack high-threat AI target type (once),60,Attacks the nearest high-threat target from the selected AITargetTypes entry until it is destroyed.
10014=Phobos: Attack farthest high-threat target type (repeat),59,Attacks the farthest high-threat target from the selected generic target type.
10015=Phobos: Attack farthest high-threat target type (once),59,Attacks the farthest high-threat target from the selected generic target type until it is destroyed.
10016=Phobos: Attack farthest high-threat AI target type (repeat),60,Attacks the farthest high-threat target from the selected AITargetTypes entry.
10017=Phobos: Attack farthest high-threat AI target type (once),60,Attacks the farthest high-threat target from the selected AITargetTypes entry until it is destroyed.
10050=Phobos: Move to enemy target type,59,Moves the team towards an enemy target from the selected generic target type.
10051=Phobos: Move to enemy AI target type,60,Moves the team towards an enemy target from the selected AITargetTypes entry.
10052=Phobos: Move to random enemy AI target type,60,Moves the team towards a random enemy target from the selected AITargetTypes entry.
10053=Phobos: Move to friendly target type,59,Moves the team towards a friendly target from the selected generic target type.
10054=Phobos: Move to friendly AI target type,60,Moves the team towards a friendly target from the selected AITargetTypes entry.
10055=Phobos: Move to random friendly AI target type,60,Moves the team towards a random friendly target from the selected AITargetTypes entry.
10056=Phobos: Move to farthest enemy target type,59,Moves the team towards the farthest enemy target from the selected generic target type.
10057=Phobos: Move to farthest enemy AI target type,60,Moves the team towards the farthest enemy target from the selected AITargetTypes entry.
10058=Phobos: Move to random farthest enemy AI target type,60,Moves the team towards a random farthest enemy target from the selected AITargetTypes entry.
10059=Phobos: Move to farthest friendly target type,59,Moves the team towards the farthest friendly target from the selected generic target type.
10060=Phobos: Move to farthest friendly AI target type,60,Moves the team towards the farthest friendly target from the selected AITargetTypes entry.
10061=Phobos: Move to random farthest friendly AI target type,60,Moves the team towards a random friendly target from the selected AITargetTypes entry.
10100=Phobos: Timed area guard,61,Area guards for the specified number of in-game seconds.
10101=Phobos: Wait until ammo is full,70,Waits until every team member using ammo has fully reloaded.
10102=Phobos: Regroup around team leader,61,Area guards around the team leader for the specified number of seconds.
10103=Phobos: Load onto transports,70,Loads compatible team members into transports in the same task force.
10104=Phobos: Chronoshift to enemy base,62,Chronoshifts the team near the enemy base using the specified cell offset.
12000=Phobos: Wait if no target found,63,Sets retry count for the following Phobos attack action. Zero retries means unlimited.
12001=Phobos: Modify target distance,62,Sets the completion distance for the following Phobos move action.
12002=Phobos: Set move action end mode,64,Sets how the following Phobos move action determines completion.
14000=Phobos: Reward AI trigger weight,65,Rewards the current AI trigger weight when this team destroys its target.
14001=Phobos: Increase AI trigger weight,65,Immediately increases the current AI trigger weight.
14002=Phobos: Decrease AI trigger weight,65,Immediately decreases the current AI trigger weight.
14003=Phobos: Unregister team success,70,Marks the team as unsuccessful for AI trigger weighting.
14004=Phobos: Force OnlyTargetHouseEnemy,66,Overrides OnlyTargetHouseEnemy for following Phobos attack and move actions.
16000=Phobos: Start timed jump to same line,61,Repeats this script line after the specified number of in-game seconds.
16001=Phobos: Start timed jump to next line,61,Continues to the next script line after the specified number of in-game seconds.
16002=Phobos: Stop timed jumps,70,Stops a timed jump started by a previous Phobos script action.
16003=Phobos: Randomly skip next action,67,Skips the next action with the specified percentage chance.
16004=Phobos: Pick random script,68,Replaces the current script with a random script from AIScriptsList.
16005=Phobos: Jump back to previous script,70,Returns from a randomly selected script to the line after action 94.
18000-18023=Phobos: Edit local variable,69,Edits a local variable. The packed parameter contains a variable index and a numeric value.
18024-18047=Phobos: Edit local variable using local variable,69,Edits a local variable using another local variable. The packed parameter contains both variable indices.
18048-18071=Phobos: Edit local variable using global variable,69,Edits a local variable using a global variable. The packed parameter contains both variable indices.

