Enemy In Spotlight...=敌人进入探照灯…
Triggers when an enemy unit enters the spotlight cast by the attached building.=当敌方单位进入附加建筑投射的探照灯范围时触发。
Local is set...=局部变量已设定…
Triggers when the specifed local is turned on.=当指定局部变量被设为开启时触发。
Local is clear...=局部变量已清除…
