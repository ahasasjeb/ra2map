; Trigger events from FAData.ini
-No Event-=（无事件）
This is a null event. There is no need to ever use this in a real trigger.=这是一个空事件，实际触发器中无需使用。
Entered by...=被进入…
Triggers when an infantry or vehicle enters the attached object. Typically this trigger is attached to a building or a cell.=当步兵或载具进入附加对象时触发。该触发器通常附加在建筑或单元格上。
Spied upon=被间谍侦察
Detects when a spy has entered the attached building.=检测间谍是否进入附加建筑。
Thieved by...=被小偷偷窃…
Triggers when a thief steals money from the specified house.=当小偷偷取指定所属方的资金时触发。
Discovered by player=被玩家发现
Detects when the attached object has been discovered by the player. Discovered means reavealed from under the shroud.=检测附加对象是否被玩家发现；“发现”指从战争迷雾中显现。
House Discovered...=所属方被发现…
Triggers when the specified house has any of its units or buildings discovered by the player.=当玩家发现指定所属方的任意单位或建筑时触发。
Attacked by any house=遭任意所属方攻击
Triggers when the attached unit is attacked in some manner. Incidental damage or friendly fire does not count.=当附加单位以任意方式受到攻击时触发。附带伤害或友军火力不计。
Destroyed by any house=被任意所属方摧毁
Triggers when the attached object has been destroyed. Destroyed by incidental damage or friendly fire doesn't count.=当附加对象被摧毁时触发。由附带伤害或友军火力造成的摧毁不计。
Any Event=任意事件
When used alone%1 it will force the trigger to spring immediately.=单独使用时，会立即触发该触发器。
Destroyed%1 Units%1 All...=所有单位被摧毁…
Triggers when all units of the specified house have been destroyed. Typically used for end of game conditions.=当指定所属方的所有单位均被摧毁时触发，通常用于游戏结束条件。
Destroyed%1 Buildings%1 All...=所有建筑被摧毁…
Triggers when all buildings of the specified side have been destroyed. Typically used for end of game conditions.=当指定所属方的所有建筑均被摧毁时触发，通常用于游戏结束条件。
Destroyed%1 All...=全部对象被摧毁…
Triggers when all objects owned by the specified house have been destroyed. This is the normal (destroy everyone) trigger condition for end of game.=当指定所属方拥有的所有对象均被摧毁时触发。这是常规的“消灭所有人”游戏结束条件。
Credits exceed...=资金超过…
Triggers when the house (for this trigger) credit total exceeds this specified amount.=当该触发器所属所属方的资金总额超过指定数值时触发。
Elapsed Time...=经过时间…
Triggers when the elapsed time has expired. This time is initialized when the trigger is created. Timer is reset whenever trigger is sprung when trigger is 'persistant'.=当经过时间到达设定值时触发。计时器在创建触发器时初始化；若触发器为“持续型”，每次触发后都会重置。
Mission Timer Expired=任务计时器到期
Triggers when the global mission timer (as displayed on the screen) has reached zero.=当屏幕显示的全局任务计时器归零时触发。
Destroyed%1 Buildings%1 #...=建筑摧毁数量…
Triggers when the number of buildings%1 owned by the trigger's specified house%1 have been destroyed.=当触发器指定所属方拥有的建筑被摧毁数量达到设定值时触发。
Destroyed%1 Units%1 #...=单位摧毁数量…
Triggers when the number of units%1 owned by the trigger's specified house%1 have been destroyed.=当触发器指定所属方拥有的单位被摧毁数量达到设定值时触发。
No Factories left=没有剩余工厂
Triggers when there are no factories left for the house specified in the trigger.=当触发器指定所属方已没有任何工厂时触发。
Civilians Evacuated=平民已撤离
Triggers when civilians have been evacuated (left the map).=当平民已撤离（离开地图）时触发。
Build Building Type...=建造建筑类型…
When the trigger's house builds the building type specified%1 then this event will spring.=当触发器所属所属方建造指定建筑类型时触发。
Build Unit Type...=建造载具类型…
When the trigger's house builds the unit type specified%1 then this event will spring.=当触发器所属所属方建造指定载具类型时触发。
Build Infantry Type...=建造步兵类型…
When the trigger's house builds the infantry type specified%1 then this event will spring.=当触发器所属所属方建造指定步兵类型时触发。
Build Aircraft Type...=建造飞机类型…
When the trigger's house builds the aircraft type specified%1 then this event will spring.=当触发器所属所属方建造指定飞机类型时触发。
Leaves map (team)...=小队离开地图…
Triggers when the specified team leaves the map. If the team is destroyed%1 it won't trigger. If all but one member is destroyed and that last member leaves the map%1 it WILL spring.=当指定小队离开地图时触发。若小队被摧毁则不会触发；若只剩一名成员且该成员离开地图，则会触发。
Zone Entry by...=区域进入者…
Triggers when a unit of the dpecified house enters the same zone that this trigger is located in. This trigger must be located in a cell and only a cell.=当指定所属方的单位进入此触发器所在的区域时触发。该触发器必须且只能放置在单元格中。
Crosses Horizontal Line...=穿越水平线…
Triggers when a unit of the specified house crosses the horizontal line as indicated by the location of this trigger. This trigger must be placed in a cell.=当指定所属方的单位穿越由该触发器位置指示的水平线时触发。该触发器必须放置在单元格中。
Crosses Vertical Line...=穿越垂直线…
Triggers when a unit of the specified house crosses the vertical line as indicated by the location of this trigger. This trigger must be placed in a cell.=当指定所属方的单位穿越由该触发器位置指示的垂直线时触发。该触发器必须放置在单元格中。
Global is set...=全局变量已设定…
Triggers when the specifed global (named in Globals.INI) is turned on.=当指定的全局变量（在 Globals.INI 中命名）被设为开启时触发。
Global is clear...=全局变量已清除…
Triggers when the specified global (named in Globals.INI) is turned off.=当指定的全局变量（在 Globals.INI 中命名）被设为关闭时触发。
Destroyed by anything [not infiltrate]=被任意方式摧毁（不含渗透）
