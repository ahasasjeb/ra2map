True if there are at least this many of this type%1 belonging to anyone=当任意所属方拥有至少设定数量的该类型对象时为真。
TechType does not Exist=科技类型不存在
True if there are none of these on the map at all.  Number doesn't mean anything.=当地图上完全不存在该类型对象时为真；数量参数无效。

; Trigger actions from FAData.ini
-No Action-=（无动作）
This is a null action. It will do nothing and is equivalent to not having an action at all. Why use it?=这是一个空动作，不会执行任何操作，等同于完全没有动作。为什么要使用它？
Winner is...=胜者为…
The winner will be forced to be the house specified. The game will end immediately. Typically%1 the player's house is specified.=强制指定所属方获胜，游戏会立即结束。通常指定玩家所属所属方。
Loser is...=败者为…
The loser will be force to be the house specified. The game will end immediately. Typically%1 the player's house is specified.=强制指定所属方失败，游戏会立即结束。通常指定玩家所属所属方。
Production Begins...=开始生产…
The computer's house (as specified) will begin production of units and structures.=指定的电脑所属方将开始生产单位和建筑。
Create Team...=创建小队…
Creates a team of the type specified (owned by the house of this trigger). The team member are NOT automatically created however.=创建指定类型的小队（归该触发器所属所属方所有）。但不会自动创建小队成员。
Destroy Team...=摧毁小队…
Destroys all instances of the team type specified. The units in those existing teams will remain and be available for recruiting into other teams.=摧毁所有指定小队类型的实例。现有小队中的单位会保留，并可被招募到其他小队。
All to Hunt...=全体进入猎杀…
Forces all units%1 of the house specified%1 into 'hunt' mode. They will seek out and destroy their enemies.=强制指定所属方的所有单位进入“猎杀”模式，主动寻找并摧毁敌人。
Reinforcement (team)...=增援部队（小队）…
