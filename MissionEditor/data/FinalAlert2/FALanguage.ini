Half health (combat only)=生命值过半（仅战斗）
Triggers when damaged to half health >from combat damage only.=当对象仅因战斗伤害降至半血时触发。
Quarter health (combat only)=生命值四分之一（仅战斗）
Triggers when damaged to quarter health from combat damage only.=当对象仅因战斗伤害降至四分之一生命值时触发。
First damaged (any source)=首次受损（任意来源）
Triggers when first suffering from combat damage from any source.=当对象首次因任意来源受损时触发。
Half health (any source)=生命值过半（任意来源）
Triggers when damaged to half health >from any source.=当对象因任意来源降至半血时触发。
Quarter health (any source)=生命值四分之一（任意来源）
Triggers when damaged to quarter health from any source.=当对象因任意来源降至四分之一生命值时触发。
Attacked by (house)...=被指定所属方攻击…
When attacked by some unit of specified house.=当受到指定所属方的任意单位攻击时触发。
Ambient light <__EQUALS__ ...=环境光 ≤ …
Triggers when the ambient light drops below a certain level.  Use numbers between 0 and 100.=当环境光低于指定等级时触发。请使用 0 到 100 之间的数值。
Ambient light >__EQUALS__ ...=环境光 ≥ …
Triggers when the ambient light rises above a certain level.  Use numbers between 0 and 100.=当环境光高于指定等级时触发。请使用 0 到 100 之间的数值。
Elapsed Scenario Time...=经过关卡时间…
When time has elapsed since start of scenario.=当自关卡开始起经过的时间达到设定值时触发。
Destroyed by anything=被任意方式摧毁
Triggers when destroyed by anything what-so-ever.=当对象因任何原因被摧毁时触发。
Pickup Crate=拾取补给箱
When crate is picked up object the trigger is attached to.=当附加对象拾取补给箱时触发。
Pickup Crate (any)=任意单位拾取补给箱
When crate is picked up by any unit.=当任意单位拾取补给箱时触发。
Random delay...=随机延迟…
