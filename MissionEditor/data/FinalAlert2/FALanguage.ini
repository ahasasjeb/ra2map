Building exists...=建筑存在…
Triggers when the building (owned by the house of this trigger) specified exists on the map. This works for buildings that are preexisting or constructed by deploying.=当指定建筑（属于该触发器所属所属方）存在于地图上时触发。对预置建筑或由部署建造的建筑都有效。
Selected by player=被玩家选中
