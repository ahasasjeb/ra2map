Drop Zone Flare (waypoint)...=空投区信号弹（路径点）…
Display a drop zone flair at the waypoint specified. The map will also be reaveald around that location.=在指定路径点显示空投区信号弹，并揭开该位置周围的地图。
Fire Sale...=变卖建筑…
Cause all buildings of the specified house to be sold (for cash and prizes). Typically this is used in the final assault by the computer.=使指定所属方的所有建筑被变卖（获得资金和奖励）。通常用于电脑的最终攻势。
Play Movie...=播放影片…
