Entered or Overflown By...=被进入或飞越…
Triggers when unit%1 infantry%1 or aircraft move over this cell. <THEM __EQUALS__ House of entering unit>=当单位、步兵或飞机经过此单元格时触发。<THEM = 进入单位所属所属方>
