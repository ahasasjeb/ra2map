[package]
name = "mission_editor_rust_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[build-dependencies]
cc = "1"
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in", "spv-out"] }

[dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }
mlua = { version = "0.12", default-features = false, features = ["lua55", "vendored"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"

[profile.dev]
panic = "unwind"
